name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Verify module files
        run: |
          go mod verify
          go mod tidy -diff

  config-schemas:
    name: Validate example configurations
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install schema validator
        run: python -m pip install --user check-jsonschema

      - name: Validate examples against schemas
        run: |
          "$HOME/.local/bin/check-jsonschema" --schemafile schemas/user-config.schema.json docs/examples/user-config.yaml
          "$HOME/.local/bin/check-jsonschema" --schemafile schemas/system-config.schema.json docs/examples/system-config.yaml
